<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Louis-Anime-Tracker</title>
      <link rel="stylesheet" href="./css/output.css">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
</head>
<body class="bg-white font-display text-xl text-ink">
      <main class="flex flex-col mx-auto my-20 border-3 rounded-3xl p-10 max-w-6/10 justify-center bg-cream">
            <h1 class="text-4xl mb-5">Anime Tracker</h1>
            <!-- top section -->
            <section class="bg-panel-gray border-3 rounded-3xl p-5 mb-5">
                  <h2 class="text-3xl pb-10">Add a show</h2>
                  <form action="" id="add-show-form" class="flex justify-between items-center">
                        <div class="flex flex-col">
                              <label for="show-title">Anime Title</label>
                              <input type="text" id="show-title" name="title" required class="border-3 rounded-3xl p-5 bg-panel-gray w-120" placeholder="e.g. Frieren">
                        </div>
                        <div class="flex flex-col">
                              <label for="show-satus">Status</label>
                              <select name="top-status" id="top-status" class="border-3 rounded-3xl p-5 w-70">
                                    <option value="watching">Watching</option>
                                    <option value="plan-to-watch">Plan to watch</option>
                                    <option value="finished">Finished</option>
                              </select>
                             
                        </div>
                        <button type="submit" class="rounded-3xl border-3 bg-butter p-5">+ Add Show</button>
                  </form>
        
            </section>
            <!-- middle section -->
            <section class="flex mb-5 justify-between items-center">
                  <h1 class="text-3xl">My shows</h1>
                  <div class="flex flex-row">
                        <h2 class="flex items-center px-5">filter</h2>
                        <select name="middle-status" id="middle-status" class="border-3 rounded-3xl bg-panel-gray p-5">
                              <option value="watching">Watching</option>
                              <option value="plan-to-watch">Plan to watch</option>
                              <option value="finished">Finished</option>
                        </select>
                  </div>

            </section>
            <!-- bottom section -->
             <section>
                  <!-- card -->
                   <ul id="show-list">
                        <li class="flex justify-between border-3 rounded-3xl p-10 mt-2 items-center">
                              <h3 class="text-3xl">Anime Name</h3>
                              <select name="card-status" id="card-status" class="border-3 rounded-3xl p-4 bg-panel-gray w-60">
                                    <option value="watching">Watching</option>
                                    <option value="plan-to-watch">Plan to watch</option>
                                    <option value="finished">Finished</option>
                              </select>
                        </li>
                        <li class="flex justify-between border-3 rounded-3xl p-10 mt-2 items-center">
                              <h3 class="text-3xl">Anime Name</h3>
                              <select name="card-status" id="card-status" class="border-3 rounded-3xl p-4 bg-panel-gray w-60">
                                    <option value="watching">Watching</option>
                                    <option value="plan-to-watch">Plan to watch</option>
                                    <option value="finished">Finished</option>
                              </select>
                        </li>
                  </ul>

             </section>
      </main>
      <script src="./js/app.js"></script>
</body>
</html>
